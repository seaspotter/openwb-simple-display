name: Build and test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Build firmware
        run: pio run -e guition_4848s040c

  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - name: Install PlatformIO
        run: pip install -U platformio
      - name: Run host-side unit tests
        run: pio test -e native_test
