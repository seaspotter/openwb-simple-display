name: Publish release and deploy Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            .pio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Build firmware + filesystem image
        run: |
          pio run -e guition_4848s040c
          pio run -e guition_4848s040c -t buildfs

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Write OTA signing key
        # Written to the runner's temp dir, destroyed with the VM at job end — never
        # persisted or cached.
        run: |
          umask 077
          printf '%s' "${{ secrets.OTA_SIGNING_PRIVATE_KEY }}" > "$RUNNER_TEMP/ota_signing_private.pem"

      - name: Assemble release artifacts + manifests
        run: |
          python3 tools/release/merge_firmware.py \
            --build-dir .pio/build/guition_4848s040c \
            --project-dir . \
            --version "${{ steps.version.outputs.version }}" \
            --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" \
            --private-key-file "$RUNNER_TEMP/ota_signing_private.pem"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v5
