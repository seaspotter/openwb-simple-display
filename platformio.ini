; openwb-simple-display — PlatformIO project configuration.
; Board bring-up uses rzeldent/esp32-smartdisplay (ST7701S + GT911 + LVGL glue for this
; board); its board-id definition comes from rzeldent/platformio-espressif32-sunton, a
; submodule at boards/ (run `git submodule update --init` after cloning).

[platformio]
default_envs = guition_4848s040c
boards_dir = boards

; Shared by the two real-hardware envs only — a bare [env] section would otherwise leak
; into native_test/sim_* too.
[esp_common]
framework = arduino
lib_deps =
    ; Pinned together: an unpinned esp32_smartdisplay resolves to 3.0.0, which doesn't
    ; build against this project's boards/ submodule commit.
    rzeldent/esp32_smartdisplay@2.1.1
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@^7
    ESP32Async/ESPAsyncWebServer@^3
    ESP32Async/AsyncTCP@^3
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8
build_flags =
    -D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -std=gnu++17
build_unflags =
    -std=gnu++11
extra_scripts =
    pre:tools/sync_www_to_data.py
    pre:tools/strip_lvgl_arm_asm.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Guition ESP32-4848S040C: ESP32-S3, 480x480 ST7701S RGB panel, GT911 touch, 16MB flash.
[env:guition_4848s040c]
extends = esp_common
; Pinned to the release contemporaneous with esp32_smartdisplay@2.1.1 — newer platform
; versions rename esp_lcd_panel_t::disp_off to disp_on_off, breaking its ST7701 driver.
platform = espressif32@6.11.0
board = esp32-4848S040CIY1
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_src_filter =
    +<*>
    -<sim/>
build_flags =
    ${esp_common.build_flags}
    -D PROJECT_NAME=\"openwb-simple-display\"

; CI-only: identical build, produces the OTA-targeted app binary (no bootloader/
; partition table) alongside the full-flash image.
[env:guition_4848s040c_ota]
extends = env:guition_4848s040c

; Host-side unit tests — only config_store.cpp is portable enough to build here;
; everything else depends on ESP-only headers.
[env:native_test]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -D UNIT_TEST
    -std=c++17
    -I src
lib_deps =
    bblanchon/ArduinoJson@^7
build_src_filter =
    +<config/config_store.cpp>

; Shared by the two desktop-UI envs below. board::/net:: are swapped for
; src/sim/sim_stubs.cpp; the real ESP build excludes src/sim/ instead.
[sim_common]
platform = native
build_flags =
    -D UNIT_TEST
    -std=gnu++17
    -D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -I include
lib_deps =
    lvgl/lvgl@9.2.2
build_src_filter =
    +<config/config_store.cpp>
    +<state/app_state.cpp>
    +<ui/>
    -<ui/lvgl_port.cpp>
    +<sim/sim_stubs.cpp>

; Headless screenshot tool — renders every screen to src/sim/out/*.bmp.
[env:sim_screenshot]
extends = sim_common
build_src_filter =
    ${sim_common.build_src_filter}
    +<sim/screenshot_main.cpp>

; Interactive simulator — SDL window, mouse as touch. Needs libsdl2-dev.
[env:sim_interactive]
extends = sim_common
build_flags =
    ${sim_common.build_flags}
    -D LV_USE_SDL=1
    -lSDL2
build_src_filter =
    ${sim_common.build_src_filter}
    +<sim/interactive_main.cpp>
