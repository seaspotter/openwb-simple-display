; openwb-simple-display — PlatformIO project configuration
; See /home/seaspotter/.claude/plans/clever-sprouting-cray.md for the full architecture plan.
;
; NOTE: board bring-up uses rzeldent/esp32-smartdisplay, which already has a tested
; ST7701S init sequence + GT911 touch + LVGL glue for this exact board (listed as
; "ESP32-4848S040C_I_Y_1/3"), rather than a hand-written register sequence. It selects
; the board via a PlatformIO board-id (`esp32-4848S040CIY1`) whose definition comes from
; rzeldent/platformio-espressif32-sunton, added as a submodule at boards/ (run
; `git submodule update --init` after cloning this repo).

[platformio]
default_envs = guition_4848s040c
boards_dir = boards

; Shared by the two real-hardware envs only (not native_test — PlatformIO merges a bare
; [env] section into every environment including native ones, which would otherwise leak
; `framework = arduino` and ESP-only lib_deps into the native build). Hardware envs opt
; in via `extends = esp_common`.
[esp_common]
framework = arduino
lib_deps =
    ; Pinned together: 2.1.1 is the registry's latest *searchable* release ("LVGL
    ; v9.2.2 driver" per its own description) — an unpinned dependency resolved to a
    ; newer 3.0.0 that doesn't build against this project's Sunton board-definitions
    ; submodule commit (expects macro names like GPIO_BCKL/DISPLAY_BCKL and an
    ; lv_display_t shape that have drifted apart between that release and the current
    ; boards/ JSON). Pinning both this and lvgl below to the versions they were
    ; actually published together for.
    rzeldent/esp32_smartdisplay@2.1.1
    lvgl/lvgl@9.2.2
    bblanchon/ArduinoJson@^7
    ESP32Async/ESPAsyncWebServer@^3
    ESP32Async/AsyncTCP@^3
    tzapu/WiFiManager@^2.0.17
    ; Pure-Arduino, built on WiFiClient/WiFiClientSecure — chosen over ESP-IDF's native
    ; esp_mqtt_client to reuse the TLS/self-signed-cert handling already working for the
    ; (now retired) HTTPS simpleAPI client, and because this project has already hit
    ; several ESP-IDF/Arduino-core version-compat walls with other libraries (see the
    ; esp32_smartdisplay/lvgl/espressif32 pins above) — a well-trodden pure-Arduino
    ; library is the lower-risk choice here (plan §5).
    knolleary/PubSubClient@^2.8
build_flags =
    ; lvgl 9.2.x's lv_conf_internal.h stringifies this itself via __LV_TO_STR, so it
    ; wants the bare path (no embedded quotes) — unlike some other LVGL minor versions.
    -D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h
    ; lv_font_conv-generated font .c files (tools/fonts/generate_fonts.sh) choose
    ; between `#include "lvgl.h"` and `#include "lvgl/lvgl.h"` based on this macro —
    ; needs to match how the rest of this project includes LVGL (`#include <lvgl.h>`).
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I include
    -std=gnu++17
build_unflags =
    -std=gnu++11
extra_scripts =
    pre:tools/sync_www_to_data.py
    pre:tools/strip_lvgl_arm_asm.py
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Guition ESP32-4848S040C: ESP32-S3, 480x480 ST7701S RGB panel, GT911 touch, 16MB flash.
; `board` id and its pin/flash/PSRAM definition come from boards/esp32-4848S040CIY1.json
; (see the submodule note above) — do not hand-override pins here; esp32-smartdisplay
; reads them from that board definition's build flags.
[env:guition_4848s040c]
extends = esp_common
; Pinned to the release contemporaneous with esp32_smartdisplay@2.1.1 (published
; 2025-06-16) — the unpinned latest (8.0.0) bundles a newer esp_lcd component whose
; esp_lcd_panel_t vtable renamed disp_off -> disp_on_off, which that library version's
; ST7701 driver source doesn't know about.
platform = espressif32@6.11.0
board = esp32-4848S040CIY1
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; src/sim/ is host-only (simulator/screenshot tools, see sim_common below) and must
; never be swept into the real ESP build.
build_src_filter =
    +<*>
    -<sim/>
build_flags =
    ${esp_common.build_flags}
    -D PROJECT_NAME=\"openwb-simple-display\"

; CI-only variant: identical build, used to produce the OTA-targeted app binary
; (no bootloader/partition table bundled) alongside the full-flash "factory" image.
[env:guition_4848s040c_ota]
extends = env:guition_4848s040c

; Host-side unit tests (config store, openWB JSON parsing, OTA manifest parsing) —
; no hardware needed, runs in CI on every push/PR. Deliberately does NOT extend
; esp_common: only src/config/config_store.cpp is portable enough to build on the host
; (its NVS calls are already #ifndef UNIT_TEST-guarded); everything else under src/
; depends on ESP-only headers (Arduino.h, LVGL, ESPAsyncWebServer, WiFiManager...), so
; this filters the project source down to just that one file rather than trying to
; compile all of src/ for a platform that can't support most of it.
[env:native_test]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -D UNIT_TEST
    -std=c++17
    -I src
lib_deps =
    bblanchon/ArduinoJson@^7
build_src_filter =
    +<config/config_store.cpp>

; Shared by the two "see the real UI without hardware" envs below. UNIT_TEST reuses the
; same host-build guard as native_test (board/net ESP-only code is swapped for
; src/sim/sim_stubs.cpp instead, see that file). src/sim/ lives under the default
; src_dir (PlatformIO doesn't support overriding src_dir per-environment — confirmed by
; trying it, "src_dir = ." was silently ignored) and is excluded from the real ESP
; build's filter below instead.
[sim_common]
platform = native
build_flags =
    -D UNIT_TEST
    -std=gnu++17
    -D LV_CONF_PATH=${platformio.include_dir}/lv_conf.h
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -I src
    -I include
lib_deps =
    lvgl/lvgl@9.2.2
build_src_filter =
    +<config/config_store.cpp>
    +<state/app_state.cpp>
    +<ui/>
    -<ui/lvgl_port.cpp>
    +<sim/sim_stubs.cpp>

; Headless screenshot tool — renders the real screens into an off-screen software
; framebuffer and dumps each to src/sim/out/*.bmp. No SDL, no display, no root needed.
[env:sim_screenshot]
extends = sim_common
build_src_filter =
    ${sim_common.build_src_filter}
    +<sim/screenshot_main.cpp>

; Interactive simulator — a real window via LVGL's bundled SDL driver, mouse acting as
; the touchscreen. Needs libsdl2-dev installed (`sudo apt-get install libsdl2-dev`).
[env:sim_interactive]
extends = sim_common
build_flags =
    ${sim_common.build_flags}
    -D LV_USE_SDL=1
    -lSDL2
build_src_filter =
    ${sim_common.build_src_filter}
    +<sim/interactive_main.cpp>
